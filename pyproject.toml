[project]
name = "arc-cua"
version = "0.1.1"
description = "Superfast action layer for computer-use agents, powered by decision models, with a standalone macOS driver"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Shiv Shanmugam"}]
keywords = ["computer-use", "agents", "macos", "accessibility", "automation", "mcp", "decision-models"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Desktop Environment",
]
dependencies = [
  "httpx[http2]>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/shhivv/arc-cua"
Documentation = "https://github.com/shhivv/arc-cua/blob/master/docs/driver.md"
Changelog = "https://github.com/shhivv/arc-cua/blob/master/CHANGELOG.md"
Issues = "https://github.com/shhivv/arc-cua/issues"

[project.scripts]
arc-cua = "arc_cua.cli:main"

[project.optional-dependencies]
browser = ["websockets>=13,<18"]
bench = ["pyobjc-framework-WebKit>=11"]  # The web pages the workflow benchmarks drive.
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]
macos = [
  "pyobjc-framework-ApplicationServices>=11",
  "pyobjc-framework-Cocoa>=11",
  "pyobjc-framework-Quartz>=11",
  "pyobjc-framework-Vision>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_cua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are model-facing prompt prose and demo document text.
"src/arc_cua/policies/choice.py" = ["E501"]
"examples/finder_preview/prepare.py" = ["E501"]
